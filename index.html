<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentirama - Emotion Tracking & Analysis</title>
    <meta name="description" content="A gentle space to track, understand, and learn from your emotions over time.">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAQ-8VA_EhYdexIo4kckAv_giqfUyTu38o",
            authDomain: "sentirama-381f7.firebaseapp.com",
            projectId: "sentirama-381f7",
            storageBucket: "sentirama-381f7.firebasestorage.app",
            messagingSenderId: "1021299681168",
            appId: "1:1021299681168:web:afcbf086eed6a3fc793515",
            measurementId: "G-5VWQ82HCM8"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Comprehensive emotion dictionary with meanings, effects, and insights
        const emotionDictionary = {
            // Positive Emotions
            'Happy': {

                copingStrategies: 'Keep a gratitude journal, express thanks to others, reflect on positive aspects of life, practice mindfulness'

                physicalSigns: 'Upright posture, steady voice, direct eye contact, relaxed shoulders',
                copingStrategies: 'Acknowledge achievements, set realistic goals, practice self-compassion, build on strengths'

                copingStrategies: 'Channel energy into productive activities, share excitement with others, plan and prepare, stay grounded'
            },
            'Loved': {
                meaning: 'A feeling of being cared for, valued, and cherished by others.',
                effects: 'Increases oxytocin levels, reduces stress, improves mental health, strengthens immune system, and enhances overall well-being.',

                meaning: 'A state of motivation and creative energy sparked by ideas, people, or experiences.',

            // Neutral Emotions
            'Thoughtful': {
                meaning: 'A state of careful consideration and reflection about ideas, situations, or experiences.',
                effects: 'Improves decision-making, enhances understanding, deepens relationships, promotes learning, and supports personal development.',
                physicalSigns: 'Furrowed brow, quiet demeanor, inward focus, slower movements',

            'Curious': {
                meaning: 'A desire to learn, explore, and understand new things or experiences.',
                effects: 'Enhances learning, increases creativity, improves problem-solving, promotes growth, and strengthens neural connections.',
                physicalSigns: 'Alert expression, forward lean, engaged eyes, exploratory behavior',
                copingStrategies: 'Ask questions, explore new topics, maintain openness, embrace learning opportunities'

                effects: 'Promotes self-awareness, supports emotional processing, enhances wisdom, improves future decisions, and deepens understanding.',

                copingStrategies: 'Set aside reflection time, journal regularly, seek solitude, practice mindfulness'
            },
            'Balanced': {
                meaning: 'A state of emotional equilibrium and harmony between different aspects of life.',

            'Present': {

            },
            'Observant': {

                copingStrategies: 'Practice active observation, take notes, ask questions, trust perceptions'
            },
            'Steady': {
                meaning: 'A consistent and reliable emotional state characterized by stability and composure.',

            },
            // Challenging Emotions
            'Stressed': {
                meaning: 'A state of mental or emotional strain resulting from demanding or adverse circumstances.',
                effects: 'Can impair focus, disrupt sleep, weaken immune system, increase irritability, and impact physical health if chronic.',

                copingStrategies: 'Practice relaxation techniques, exercise regularly, prioritize tasks, seek support, establish boundaries'
            },
            'Sad': {
                meaning: 'A feeling of sorrow, unhappiness, or grief, often in response to loss or disappointment.',
                effects: 'Can lower energy, reduce motivation, affect appetite and sleep, promote withdrawal, but also supports emotional processing.',

                copingStrategies: 'Allow yourself to feel, talk to someone, engage in gentle activities, practice self-compassion, seek support if persistent'
            },
            'Frustrated': {
                meaning: 'A feeling of annoyance and dissatisfaction caused by obstacles, unmet expectations, or lack of progress.',
                effects: 'Can increase tension, reduce patience, impair problem-solving, affect relationships, but can also motivate change.',
                physicalSigns: 'Tension, clenched jaw, restlessness, irritability, agitation',
                copingStrategies: 'Take a break, identify obstacles, adjust expectations, problem-solve systematically, practice patience'
            },
            'Anxious': {
                meaning: 'A feeling of worry, nervousness, or unease about uncertain outcomes or future events.',
                effects: 'Can disrupt concentration, affect sleep, increase physical tension, impair decision-making, and impact daily functioning.',
                physicalSigns: 'Racing heart, sweating, restlessness, tension, difficulty concentrating',
                copingStrategies: 'Practice deep breathing, challenge worried thoughts, focus on present, engage in calming activities, seek professional help if severe'
            },
            'Tired': {
                meaning: 'A state of physical or mental exhaustion requiring rest and recovery.',
                effects: 'Reduces performance, impairs judgment, lowers mood, weakens immune system, and affects safety and well-being.',
                physicalSigns: 'Low energy, heavy limbs, difficulty concentrating, yawning, slowed reactions',
                copingStrategies: 'Prioritize sleep, take breaks, reduce commitments, practice good sleep hygiene, address underlying causes'
            },
            'Overwhelmed': {
                meaning: 'Feeling unable to cope with too many demands, responsibilities, or emotions at once.',
                effects: 'Can cause paralysis, increase stress, impair decision-making, affect relationships, and reduce effectiveness.',
                physicalSigns: 'Mental fog, physical tension, sense of drowning, difficulty prioritizing',
                copingStrategies: 'Break tasks into smaller steps, delegate when possible, say no, seek support, practice self-care'
            },
            'Uncertain': {
                meaning: 'Doubt and lack of conviction about decisions, outcomes, or the future.',
                effects: 'Can delay decisions, increase anxiety, reduce confidence, affect planning, but can also promote careful consideration.',
                physicalSigns: 'Hesitation, second-guessing, mental confusion, lack of clarity',
                copingStrategies: 'Gather information, list pros and cons, trust your intuition, accept that some uncertainty is normal, take small steps'
            },
            'Restless': {
                meaning: 'An inability to rest or relax, characterized by agitation and a need for movement or change.',
                effects: 'Disrupts rest, affects focus, increases tension, impacts sleep quality, but can also signal need for change or action.',
                physicalSigns: 'Fidgeting, pacing, inability to sit still, mental agitation, poor sleep',
                copingStrategies: 'Engage in physical activity, identify underlying needs, practice grounding techniques, establish calming routines'
            }
        };

        const SentiramaApp = () => {
            const [currentView, setCurrentView] = useState('loading');
            const [user, setUser] = useState(null);
            const [selectedEmotion, setSelectedEmotion] = useState(null);
            const [emotionEntries, setEmotionEntries] = useState([]);
            const [userName, setUserName] = useState('');
            const [consentAccepted, setConsentAccepted] = useState(false);
            const [formData, setFormData] = useState({
                activity: '',
                location: '',
                people: '',
                notes: ''
            });
            const [selectedEmotionForDict, setSelectedEmotionForDict] = useState(null);
            const [authError, setAuthError] = useState('');
            const [authLoading, setAuthLoading] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const chartRefs = {
                timeline: useRef(null),
                distribution: useRef(null),
                timeOfDay: useRef(null)
            };
            const chartInstances = useRef({});

            const emotionCategories = {
                positive: {
                    color: 'from-slate-200 to-slate-300',
                    borderColor: 'border-slate-400',
                    emotions: [
                        { name: 'Happy' },
                        { name: 'Grateful' },
                        { name: 'Peaceful' },
                        { name: 'Confident' },
                        { name: 'Excited' },
                        { name: 'Loved' },
                        { name: 'Inspired' },
                        { name: 'Calm' }
                    ]
                },
                neutral: {
                    color: 'from-blue-100 to-blue-200',
                    borderColor: 'border-blue-300',
                    emotions: [
                        { name: 'Thoughtful' },
                        { name: 'Curious' },
                        { name: 'Focused' },
                        { name: 'Reflective' },
                        { name: 'Balanced' },
                        { name: 'Present' },
                        { name: 'Observant' },
                        { name: 'Steady' }
                    ]
                },
                challenging: {
                    color: 'from-amber-100 to-amber-200',
                    borderColor: 'border-amber-300',
                    emotions: [
                        { name: 'Stressed' },
                        { name: 'Sad' },
                        { name: 'Frustrated' },
                        { name: 'Anxious' },
                        { name: 'Tired' },
                        { name: 'Overwhelmed' },
                        { name: 'Uncertain' },
                        { name: 'Restless' }
                    ]
                }
            };

            // Listen to authentication state
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    setUser(user);
                    if (user) {
                        // Load user profile and emotion entries from Firestore
                        await loadUserData(user.uid);
                        setCurrentView('home');
                    } else {
                        setCurrentView('login');
                        setEmotionEntries([]);
                        setUserName('');
                    }
                });

                return () => unsubscribe();
            }, []);

            // Load user data from Firestore
            const loadUserData = async (userId) => {
                try {
                    // Load user profile
                    const profileDoc = await db.collection('users').doc(userId).get();
                    if (profileDoc.exists) {
                        const profileData = profileDoc.data();
                        setUserName(profileData.name || '');
                        setConsentAccepted(profileData.consentAccepted || false);
                    }

                    // Load emotion entries
                    const entriesSnapshot = await db.collection('users').doc(userId).collection('emotions')
                        .orderBy('timestamp', 'desc')
                        .get();

                    const entries = entriesSnapshot.docs.map(doc => {
                        const data = doc.data();
                        return {
                            ...data,
                            id: doc.id,
                            timestamp: data.timestamp.toDate()
                        };
                    });

                    setEmotionEntries(entries);
                } catch (error) {
                    console.error('Error loading user data:', error);
                }
            };

            // Save user profile to Firestore
            const saveUserProfile = async (name, consent) => {
                if (!user) return;

                try {
                    await db.collection('users').doc(user.uid).set({
                        name: name,
                        consentAccepted: consent,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                } catch (error) {
                    console.error('Error saving user profile:', error);
                }
            };

            // Sign up
            const handleSignup = async (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthLoading(true);

                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    // User will be redirected to onboarding by auth state listener
                    setCurrentView('onboarding');
                } catch (error) {
                    setAuthError(error.message);
                } finally {
                    setAuthLoading(false);
                }
            };

            // Log in
            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthLoading(true);

                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    // User will be redirected to home by auth state listener
                } catch (error) {
                    setAuthError(error.message);
                } finally {
                    setAuthLoading(false);
                }
            };

            // Sign out
            const handleSignOut = async () => {
                try {
                    await auth.signOut();
                    setCurrentView('login');
                } catch (error) {
                    console.error('Error signing out:', error);
                }
            };

            const saveUserName = async () => {
                if (userName.trim() && consentAccepted && user) {
                    await saveUserProfile(userName, consentAccepted);
                    setCurrentView('home');
                }
            };

            const saveEmotionEntry = async () => {
                if (!selectedEmotion || !user) return;

                const now = new Date();
                const entry = {
                    emotion: selectedEmotion,
                    category: Object.keys(emotionCategories).find(cat =>
                        emotionCategories[cat].emotions.some(e => e.name === selectedEmotion)
                    ),
                    context: { ...formData },
                    timestamp: firebase.firestore.Timestamp.fromDate(now),
                    hour: now.getHours(),
                    dayOfWeek: now.getDay()
                };

                try {
                    const docRef = await db.collection('users').doc(user.uid).collection('emotions').add(entry);

                    // Add to local state
                    setEmotionEntries(prev => [{
                        ...entry,
                        id: docRef.id,
                        timestamp: now
                    }, ...prev]);

                    setSelectedEmotion(null);
                    setFormData({ activity: '', location: '', people: '', notes: '' });
                    setCurrentView('success');
                } catch (error) {
                    console.error('Error saving emotion entry:', error);
                    alert('Error saving entry. Please try again.');
                }
            };

            const handleInputChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };

            const viewEmotionDetails = (emotionName) => {
                setSelectedEmotionForDict(emotionName);
                setCurrentView('emotionDetail');
            };

            // Cleanup charts when component unmounts or view changes
            useEffect(() => {
                return () => {
                    Object.values(chartInstances.current).forEach(chart => {
                        if (chart) chart.destroy();
                    });
                };
            }, [currentView]);

            // Create visualization charts
            const createCharts = () => {
                // Cleanup existing charts
                Object.values(chartInstances.current).forEach(chart => {
                    if (chart) chart.destroy();
                });
                chartInstances.current = {};

                if (emotionEntries.length === 0) return;

                // Timeline Chart (Last 30 days)
                const timelineCanvas = chartRefs.timeline.current;
                if (timelineCanvas) {
                    const ctx = timelineCanvas.getContext('2d');

                    const last30Days = [...Array(30)].map((_, i) => {
                        const date = new Date();
                        date.setDate(date.getDate() - (29 - i));
                        return date.toISOString().split('T')[0];
                    });

                    const emotionsByDay = last30Days.map(date => {
                        const dayEntries = emotionEntries.filter(entry =>
                            entry.timestamp.toISOString().split('T')[0] === date
                        );
                        return {
                            date,
                            positive: dayEntries.filter(e => e.category === 'positive').length,
                            neutral: dayEntries.filter(e => e.category === 'neutral').length,
                            challenging: dayEntries.filter(e => e.category === 'challenging').length
                        };
                    });

                    chartInstances.current.timeline = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: last30Days.map(d => new Date(d).toLocaleDateString('en', { month: 'short', day: 'numeric' })),
                            datasets: [
                                {
                                    label: 'Positive',
                                    data: emotionsByDay.map(d => d.positive),
                                    borderColor: '#94a3b8',
                                    backgroundColor: 'rgba(148, 163, 184, 0.1)',
                                    tension: 0.4
                                },
                                {
                                    label: 'Neutral',
                                    data: emotionsByDay.map(d => d.neutral),
                                    borderColor: '#93c5fd',
                                    backgroundColor: 'rgba(147, 197, 253, 0.1)',
                                    tension: 0.4
                                },
                                {
                                    label: 'Challenging',
                                    data: emotionsByDay.map(d => d.challenging),
                                    borderColor: '#fbbf24',
                                    backgroundColor: 'rgba(251, 191, 36, 0.1)',
                                    tension: 0.4
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'bottom'
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        stepSize: 1
                                    }
                                }
                            }
                        }
                    });
                }

                // Distribution Chart
                const distributionCanvas = chartRefs.distribution.current;
                if (distributionCanvas) {
                    const ctx = distributionCanvas.getContext('2d');

                    const categoryCounts = {
                        positive: emotionEntries.filter(e => e.category === 'positive').length,
                        neutral: emotionEntries.filter(e => e.category === 'neutral').length,
                        challenging: emotionEntries.filter(e => e.category === 'challenging').length
                    };

                    chartInstances.current.distribution = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Positive', 'Neutral', 'Challenging'],
                            datasets: [{
                                data: [categoryCounts.positive, categoryCounts.neutral, categoryCounts.challenging],
                                backgroundColor: ['#94a3b8', '#93c5fd', '#fbbf24'],
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'bottom'
                                }
                            }
                        }
                    });
                }

                // Time of Day Chart
                const timeOfDayCanvas = chartRefs.timeOfDay.current;
                if (timeOfDayCanvas) {
                    const ctx = timeOfDayCanvas.getContext('2d');

                    const hourCounts = Array(24).fill(0);
                    emotionEntries.forEach(entry => {
                        hourCounts[entry.hour]++;
                    });

                    chartInstances.current.timeOfDay = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: Array(24).fill(0).map((_, i) => `${i}:00`),
                            datasets: [{
                                label: 'Check-ins by Hour',
                                data: hourCounts,
                                backgroundColor: '#a5b4fc',
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: false
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        stepSize: 1
                                    }
                                }
                            }
                        }
                    });
                }
            };

            // Trigger chart creation when entering insights view
            useEffect(() => {
                if (currentView === 'insights' && emotionEntries.length > 0) {
                    setTimeout(createCharts, 100);
                }
            }, [currentView, emotionEntries]);

            // Loading View
            if (currentView === 'loading') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-slate-600 text-xl font-light">Loading...</div>
                        </div>
                    </div>
                );
            }

            // Login View
            if (currentView === 'login') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                        <div className="max-w-md mx-auto min-h-screen">
                            <div className="p-8">
                                <div className="text-center space-y-8 pt-12">
                                    <h1 className="text-4xl font-light text-slate-700 mb-4">Welcome to Sentirama</h1>
                                    <p className="text-slate-600 text-lg leading-relaxed mb-8">
                                        Sign in to continue your emotional journey
                                    </p>

                                    <div className="bg-white/60 backdrop-blur-sm p-8 rounded-2xl shadow-sm space-y-6">
                                        <h2 className="text-2xl font-light text-slate-700">Sign In</h2>

                                        {authError && (
                                            <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl">
                                                {authError}
                                            </div>
                                        )}

                                        <form onSubmit={handleLogin} className="space-y-4">
                                            <div>
                                                <label className="block text-slate-700 mb-2 text-sm font-medium">Email</label>
                                                <input
                                                    type="email"
                                                    placeholder="your@email.com"
                                                    value={email}
                                                    onChange={(e) => setEmail(e.target.value)}
                                                    className="w-full p-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-300 focus:border-transparent bg-white"
                                                    required
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-slate-700 mb-2 text-sm font-medium">Password</label>
                                                <input
                                                    type="password"
                                                    placeholder="••••••••"
                                                    value={password}
                                                    onChange={(e) => setPassword(e.target.value)}
                                                    className="w-full p-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-300 focus:border-transparent bg-white"
                                                    required
                                                />
                                            </div>

                                            <button
                                                type="submit"
                                                disabled={authLoading}
                                                className="w-full bg-indigo-400 hover:bg-indigo-500 text-white py-4 px-8 rounded-xl font-light text-lg transition-all duration-200 shadow-sm hover:shadow-md disabled:opacity-50"
                                            >

                                        </div>
                                    ) : (
                                        <div className="space-y-6">
                                            {/* Statistics Cards */}
                                            <div className="grid grid-cols-3 gap-3">
                                                <div className="bg-white/70 p-4 rounded-xl text-center shadow-sm">
                                                    <p className="text-2xl font-light text-slate-800">{emotionEntries.length}</p>
                                                    <p className="text-sm text-slate-600">Total</p>
                                                </div>
                                                <div className="bg-white/70 p-4 rounded-xl text-center shadow-sm">
                                                    <p className="text-2xl font-light text-slate-600">
                                                        {emotionEntries.filter(e => e.category === 'positive').length}
                                                    </p>
                                                    <p className="text-sm text-slate-600">Positive</p>
                                                </div>
                                                <div className="bg-white/70 p-4 rounded-xl text-center shadow-sm">
                                                    <p className="text-2xl font-light text-amber-600">
                                                        {emotionEntries.filter(e => e.category === 'challenging').length}
                                                    </p>
                                                    <p className="text-sm text-slate-600">Challenge</p>
                                                </div>
                                            </div>

                                            {/* Timeline Chart */}
                                            <div className="bg-white/70 p-4 rounded-xl shadow-sm">
                                                <h3 className="font-medium text-slate-800 mb-3">Emotion Timeline (Last 30 Days)</h3>
                                                <div className="chart-container">
                                                    <canvas ref={chartRefs.timeline}></canvas>
                                                </div>
                                            </div>

                                            {/* Distribution Chart */}
                                            <div className="bg-white/70 p-4 rounded-xl shadow-sm">
                                                <h3 className="font-medium text-slate-800 mb-3">Emotion Distribution</h3>
                                                <div className="chart-container">
                                                    <canvas ref={chartRefs.distribution}></canvas>
                                                </div>
                                            </div>

                                            {/* Time of Day Chart */}
                                            <div className="bg-white/70 p-4 rounded-xl shadow-sm">
                                                <h3 className="font-medium text-slate-800 mb-3">Check-ins by Time of Day</h3>
                                                <div className="chart-container">
                                                    <canvas ref={chartRefs.timeOfDay}></canvas>
                                                </div>
                                            </div>

                                            {/* Recent Entries */}
                                            <div className="bg-white/70 p-4 rounded-xl shadow-sm">
                                                <h3 className="font-medium text-slate-800 mb-3">Recent Entries</h3>
                                                <div className="space-y-3">
                                                    {emotionEntries.slice(0, 5).map(entry => (
                                                        <div key={entry.id} className="border-l-4 border-indigo-300 pl-3 py-2 bg-white/50 rounded-r-lg">
                                                            <div className="flex justify-between items-start">
                                                                <div className="flex-1">
                                                                    <div className="flex items-center space-x-2 mb-1">
                                                                        <p className="font-medium text-slate-800">{entry.emotion}</p>
                                                                        <span className={`px-2 py-1 rounded-full text-xs font-medium ${
                                                                            entry.category === 'positive' ? 'bg-slate-200 text-slate-700' :
                                                                            entry.category === 'neutral' ? 'bg-blue-100 text-blue-700' :
                                                                            'bg-amber-100 text-amber-700'
                                                                        }`}>
                                                                            {entry.category}
                                                                        </span>
                                                                    </div>
                                                                    <div className="text-sm text-slate-600 space-y-1">
                                                                        <p>{entry.timestamp.toLocaleDateString()} at {entry.timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                                                                        {entry.context.activity && (
                                                                            <p><span className="font-medium">Activity:</span> {entry.context.activity}</p>
                                                                        )}
                                                                        {entry.context.location && (
                                                                            <p><span className="font-medium">Location:</span> {entry.context.location}</p>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // Pattern Analysis View
            if (currentView === 'patterns') {
                // Analyze patterns by location, activity, and people
                const locationPatterns = {};
                const activityPatterns = {};
                const peoplePatterns = {};

                emotionEntries.forEach(entry => {
                    const { location, activity, people } = entry.context;

                    if (location) {
                        if (!locationPatterns[location]) {
                            locationPatterns[location] = { positive: 0, neutral: 0, challenging: 0, total: 0 };
                        }
                        locationPatterns[location][entry.category]++;
                        locationPatterns[location].total++;
                    }

                    if (activity) {
                        if (!activityPatterns[activity]) {
                            activityPatterns[activity] = { positive: 0, neutral: 0, challenging: 0, total: 0 };
                        }
                        activityPatterns[activity][entry.category]++;
                        activityPatterns[activity].total++;
                    }

                    if (people) {
                        if (!peoplePatterns[people]) {
                            peoplePatterns[people] = { positive: 0, neutral: 0, challenging: 0, total: 0 };
                        }
                        peoplePatterns[people][entry.category]++;
                        peoplePatterns[people].total++;
                    }
                });

                const renderPatternSection = (title, patterns) => {
                    const sortedPatterns = Object.entries(patterns).sort((a, b) => b[1].total - a[1].total);

                    if (sortedPatterns.length === 0) {
                        return (
                            <div className="bg-white/70 p-4 rounded-xl shadow-sm">
                                <h3 className="font-medium text-slate-800 mb-2">{title}</h3>
                                <p className="text-slate-500 text-sm">No data yet. Add context to your entries to see patterns.</p>
                            </div>
                        );
                    }

                    return (
                        <div className="bg-white/70 p-4 rounded-xl shadow-sm">
                            <h3 className="font-medium text-slate-800 mb-3">{title}</h3>
                            <div className="space-y-3">
                                {sortedPatterns.slice(0, 5).map(([name, stats]) => (
                                    <div key={name} className="border-l-4 border-indigo-300 pl-3 py-2 bg-white/50 rounded-r-lg">
                                        <p className="font-medium text-slate-800 mb-2">{name}</p>
                                        <div className="flex space-x-2 text-xs">
                                            <span className="px-2 py-1 bg-slate-200 text-slate-700 rounded">
                                                Positive: {stats.positive}
                                            </span>
                                            <span className="px-2 py-1 bg-blue-100 text-blue-700 rounded">
                                                Neutral: {stats.neutral}
                                            </span>
                                            <span className="px-2 py-1 bg-amber-100 text-amber-700 rounded">
                                                Challenge: {stats.challenging}
                                            </span>
                                        </div>
                                        <p className="text-xs text-slate-500 mt-1">Total entries: {stats.total}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                };

                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                        <div className="max-w-md mx-auto min-h-screen">
                            <div className="p-8">
                                <div className="space-y-6">
                                    <div className="text-center">
                                        <button
                                            onClick={() => setCurrentView('home')}
                                            className="mb-4 text-slate-600 hover:text-slate-800"
                                        >
                                            Back to home
                                        </button>
                                        <h2 className="text-2xl font-light text-slate-800 mb-2">
                                            Pattern Analysis
                                        </h2>
                                        <p className="text-slate-600">
                                            Discover how situations impact your emotions
                                        </p>
                                    </div>

                                    {emotionEntries.length === 0 ? (
                                        <div className="text-center py-8">
                                            <p className="text-slate-500 mb-4">No entries yet. Start tracking to see patterns.</p>
                                            <button
                                                onClick={() => setCurrentView('emotion')}
                                                className="bg-indigo-400 hover:bg-indigo-500 text-white py-2 px-6 rounded-xl font-light"
                                            >
                                                Add your first entry
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            {renderPatternSection('Patterns by Location', locationPatterns)}
                                            {renderPatternSection('Patterns by Activity', activityPatterns)}
                                            {renderPatternSection('Patterns by Social Context', peoplePatterns)}

                                            <div className="bg-indigo-100/70 p-4 rounded-xl mt-6">
                                                <h3 className="font-medium text-indigo-900 mb-2">Learning from Patterns</h3>
                                                <p className="text-sm text-indigo-800 leading-relaxed">
                                                    Understanding which situations correlate with different emotions helps you
                                                    make informed choices about your environment, activities, and social interactions.
                                                    Use these insights to cultivate conditions that support your well-being.
                                                </p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SentiramaApp />);
    </script>
</body>
</html>
